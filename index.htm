<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact Form</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="contact-container">

    <!-- LEFT CONTACT INFORMATION -->
    <section class="contact-info">


      <div class="info-content">

        <h2>Contact Information</h2>

        <p class="description">
          We'll create high-quality linkable content and
          build at least 40 high-authority backlinks.
        </p>

        <div class="contact-details">

          <div class="contact-item">
            <span class="icon">☎</span>
            <div>
              <p>+2349031410886</p>
              <p>+2347076385447</p>
            </div>
          </div>

          <div class="contact-item">
            <span class="icon">✉</span>
            <p>Support@uprangly.com</p>
          </div>

          <div class="contact-item">
            <span class="icon">●</span>
            <p>OGUN, NIGERIA</p>
          </div>

        </div>

      </div>

      <!-- Decorative circle -->
      <div class="circle"></div>

    </section>


    <!-- RIGHT FORM -->
    <section class="contact-form">

      <form action="https://formspree.io/f/xjykwjjy" method="post">

        <div class="form-row">

          <div class="form-group">
            <label for="name">Your Name</label>

            <input
              type="text"
              id="name"
              name="name"
              value=""
              placeholder="Olatunji Daniel "
            >
          </div>

          <div class="form-group">
            <label for="email">Your Email</label>

            <input
              type="email"
              id="email"
              name="email"
              value="olaniranolatunji866@gmail.com"
            >
          </div>

        </div>


        <div class="form-group subject">

          <label for="subject">Your Subject</label>

          <input
            type="text"
            id="subject"
            name="subject"
            value="I want to hire you quickly"
          >

        </div>


        <div class="form-group message">

          <label for="message">Message</label>

          <textarea
            id="message"
            name="message"
            placeholder="Write here your message"
          ></textarea>

        </div>


        <button type="submit">
          Send Message
        </button>

      </form>

    </section>

  </main>

</body>
</html>
